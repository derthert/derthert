<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Emirhan, derthert: Yazılım Geliştirici ve Sistem Mimarı">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f2efe9" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="60%">
      <stop offset="0" stop-color="#ff5b2e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0a09" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0b0a09" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0b0a09" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .rise { animation: rise 0.9s ease-out both; }
      .rise2 { animation: rise 0.9s 0.15s ease-out both; }
      .rise3 { animation: rise 0.9s 0.3s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="#0b0a09"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect width="760" height="320" fill="url(#fade)"/>

    <!-- Sağ taraf: soyut sistem diyagramı -->
    <g stroke="#ff5b2e" stroke-width="1.5" fill="none" opacity="0.85">
      <path d="M930 96 L1040 96 L1040 160 L1150 160" stroke-opacity="0.5"/>
      <path d="M930 224 L1040 224 L1040 160" stroke-opacity="0.5"/>
      <path d="M1150 160 L1150 96" stroke-opacity="0.3" stroke-dasharray="4 6"/>
      <path d="M1150 160 L1150 224" stroke-opacity="0.3" stroke-dasharray="4 6"/>
    </g>
    <g class="mono" font-size="13" fill="#f2efe9">
      <rect x="850" y="78" width="80" height="36" rx="6" fill="#141210" stroke="#2a2622"/>
      <text x="890" y="101" text-anchor="middle" fill="#8c877f">web</text>
      <rect x="850" y="206" width="80" height="36" rx="6" fill="#141210" stroke="#2a2622"/>
      <text x="890" y="229" text-anchor="middle" fill="#8c877f">app</text>
      <rect x="1000" y="142" width="80" height="36" rx="6" fill="#141210" stroke="#ff5b2e" stroke-opacity="0.7"/>
      <text x="1040" y="165" text-anchor="middle" fill="#ff5b2e">api</text>
      <rect x="1110" y="142" width="80" height="36" rx="6" fill="#141210" stroke="#2a2622"/>
      <text x="1150" y="165" text-anchor="middle" fill="#8c877f">core</text>
      <rect x="1110" y="70" width="80" height="26" rx="5" fill="#141210" stroke="#2a2622"/>
      <text x="1150" y="88" text-anchor="middle" fill="#5f5a54" font-size="11">db</text>
      <rect x="1110" y="224" width="80" height="26" rx="5" fill="#141210" stroke="#2a2622"/>
      <text x="1150" y="242" text-anchor="middle" fill="#5f5a54" font-size="11">infra</text>
    </g>
    <circle cx="1040" cy="160" r="3" fill="#ff5b2e">
      <animate attributeName="r" values="3;9;3" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Sol taraf: kimlik -->
    <g class="rise">
      <text x="72" y="92" class="mono" font-size="15" fill="#ff5b2e" letter-spacing="2">~/derthert<tspan class="blink" fill="#ff5b2e">_</tspan></text>
    </g>
    <g class="rise2">
      <text x="68" y="168" class="sans" font-size="68" font-weight="700" fill="#f2efe9" letter-spacing="-1.5">Emirhan</text>
    </g>
    <g class="rise3">
      <text x="72" y="210" class="sans" font-size="22" fill="#f2efe9" fill-opacity="0.85">Yazılım Geliştirici <tspan fill="#ff5b2e">·</tspan> Sistem Mimarı</text>
      <rect x="72" y="234" width="48" height="3" rx="1.5" fill="#ff5b2e"/>
      <text x="72" y="268" class="mono" font-size="14" fill="#8c877f" letter-spacing="0.5">backend · web · masaüstü · oyun sunucuları</text>
    </g>

    <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="none" stroke="#f2efe9" stroke-opacity="0.08"/>
  </g>
</svg>
