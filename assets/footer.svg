<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="90" viewBox="0 0 1280 90" role="img" aria-label="Create, Develop, Manage">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5b2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff5b2e" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="90" rx="14"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="90" fill="#0b0a09"/>
    <rect x="0" y="0" width="1280" height="2" fill="url(#line)"/>
    <text x="640" y="51" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#f2efe9" letter-spacing="4">CREATE <tspan fill="#ff5b2e">·</tspan> DEVELOP <tspan fill="#ff5b2e">·</tspan> MANAGE</text>
    <rect x="0.5" y="0.5" width="1279" height="89" rx="14" fill="none" stroke="#f2efe9" stroke-opacity="0.08"/>
  </g>
</svg>
